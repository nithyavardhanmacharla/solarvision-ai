<svg viewBox="0 0 600 350" width="600" height="350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient for preview/standalone -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F8FAFC" />
      <stop offset="100%" stopColor="#F1F5F9" />
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="50%" stopColor="#EAB308" />
      <stop offset="100%" stopColor="#CA8A04" />
    </linearGradient>

    <!-- Solar Panel Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E40AF" />
      <stop offset="100%" stopColor="#1E1B4B" />
    </linearGradient>

    <!-- Eye/Lens Blue Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#1D4ED8" />
    </linearGradient>

    <!-- Circuit Glow -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- EMBLEM ROOT GROUP (Centered at X=300, Y=110) -->
  <g transform="translate(200, 10)">
    <!-- TOP SUN RAYS -->
    <g>
      <polygon points="100,10 93,42 107,42" fill="url(#sunGrad)" />
      <polygon points="72,20 74,49 87,44" fill="url(#sunGrad)" />
      <polygon points="48,38 60,61 70,52" fill="url(#sunGrad)" />
      <polygon points="128,20 113,44 126,49" fill="url(#sunGrad)" />
      <polygon points="152,38 130,52 140,61" fill="url(#sunGrad)" />
    </g>

    <!-- CIRCUIT NODES (LEFT & RIGHT) -->
    <g stroke="#34D399" stroke-width="1.5" opacity="0.85">
      <line x1="30" y1="55" x2="48" y2="70" />
      <line x1="48" y1="70" x2="35" y2="90" />
      <line x1="35" y1="90" x2="55" y2="105" />
      <line x1="55" y1="105" x2="25" y2="120" />
      <line x1="48" y1="70" x2="68" y2="75" />
      <line x1="35" y1="90" x2="65" y2="95" />
      <line x1="170" y1="55" x2="152" y2="70" />
      <line x1="152" y1="70" x2="165" y2="90" />
      <line x1="165" y1="90" x2="145" y2="105" />
      <line x1="145" y1="105" x2="175" y2="120" />
      <line x1="152" y1="70" x2="132" y2="75" />
    </g>

    <g fill="#10B981" filter="url(#glowGreen)">
      <circle cx="30" cy="55" r="4" />
      <circle cx="48" cy="70" r="3.5" />
      <circle cx="35" cy="90" r="4.5" />
      <circle cx="55" cy="105" r="3.5" />
      <circle cx="25" cy="120" r="4" />
      <circle cx="170" cy="55" r="4" />
      <circle cx="152" cy="70" r="3.5" />
      <circle cx="165" cy="90" r="4.5" />
      <circle cx="145" cy="105" r="3.5" />
      <circle cx="175" cy="120" r="4" />
    </g>

    <!-- SOLAR PANEL GRID -->
    <g>
      <polygon points="25,145 80,110 95,140 40,175" fill="url(#panelGrad)" stroke="#38BDF8" stroke-width="1.5" />
      <line x1="43" y1="128" x2="60" y2="157" stroke="#93C5FD" stroke-width="1" />
      <line x1="62" y1="117" x2="78" y2="146" stroke="#93C5FD" stroke-width="1" />
      <line x1="33" y1="140" x2="88" y2="122" stroke="#93C5FD" stroke-width="1" />
      <line x1="37" y1="155" x2="92" y2="132" stroke="#93C5FD" stroke-width="1" />
    </g>

    <!-- CENTER EYE LENS -->
    <path d="M 65 95 C 65 55, 145 55, 175 95 C 145 135, 65 135, 65 95 Z" fill="#0F172A" stroke="#1D4ED8" stroke-width="6" />
    <circle cx="108" cy="95" r="34" fill="#1E293B" stroke="#3B82F6" stroke-width="5" />
    <circle cx="108" cy="95" r="28" fill="url(#sunGrad)" opacity="0.2" />

    <g stroke="#60A5FA" stroke-width="1" opacity="0.6">
      <line x1="95" y1="80" x2="115" y2="80" />
      <line x1="95" y1="80" x2="108" y2="105" />
      <line x1="115" y1="80" x2="108" y2="105" />
      <line x1="90" y1="95" x2="126" y2="95" />
    </g>
    <circle cx="95" cy="80" r="2" fill="#FACC15" />
    <circle cx="115" cy="80" r="2" fill="#FACC15" />
    <circle cx="125" cy="95" r="2" fill="#38BDF8" />

    <path d="M 94 82 L 105 110 L 118 82" stroke="#1E40AF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 94 82 L 105 110 L 118 82" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="114" y="108" fill="#FACC15" font-size="13" font-weight="900" font-family="sans-serif">AI</text>

    <!-- SUNBEAM CIRCUITS -->
    <g stroke="#F59E0B" stroke-width="2" stroke-linecap="round">
      <line x1="125" y1="135" x2="140" y2="160" />
      <line x1="135" y1="130" x2="155" y2="155" />
      <line x1="145" y1="125" x2="168" y2="148" />
    </g>
    <circle cx="140" cy="160" r="2.5" fill="#34D399" />
    <circle cx="155" cy="155" r="2.5" fill="#34D399" />
    <circle cx="168" cy="148" r="2.5" fill="#34D399" />
  </g>

  <!-- TEXT TYPOGRAPHY -->
  <!-- 1. TITLE: SOLARVISION AI -->
  <text x="300" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="1">
    <tspan fill="#1E3A8A">SOLARVISION </tspan>
    <tspan fill="#EAB308">AI</tspan>
  </text>

  <!-- 2. SUBTITLE: ENGINE v2.4 WITH DIVIDER LINES -->
  <line x1="180" y1="262" x2="250" y2="262" stroke="#10B981" stroke-width="1.5" />
  <text x="300" y="267" text-anchor="middle" font-family="monospace" font-weight="800" font-size="16" fill="#047857" letter-spacing="2">
    ENGINE v2.4
  </text>
  <line x1="350" y1="262" x2="420" y2="262" stroke="#10B981" stroke-width="1.5" />

  <!-- 3. TAGLINE: PHYSICS SIMULATION & SOLAR RESOURCE INTELLIGENCE -->
  <text x="300" y="295" text-anchor="middle" font-family="monospace" font-weight="700" font-size="12" fill="#1E293B" letter-spacing="2.5">
    PHYSICS SIMULATION &amp; SOLAR RESOURCE INTELLIGENCE
  </text>
</svg>
